name: Pipeline DevSecOps & Continuous Delivery

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Quality Gate 1: Detecção de Segredos e Credenciais Vazadas (Secret Scanning)
  # ----------------------------------------------------------------------------
  secret-scan:
    name: "Gate 1: Gitleaks (Secret Scanning)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4 # Pode atualizar para v6 se pretender compatibilidade com Node.js 24
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        # O Gitleaks v2 deixará de funcionar na GitHub em setembro de 2026 (fim do Node 20). Atualizado para v3.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Quality Gate 2: Compilação TypeScript e Testes Unitários com Cobertura
  # ----------------------------------------------------------------------------
  build-and-test:
    name: "Gate 2: Build & Testes Unitários (Jest)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalação de Dependências
        run: npm ci

      - name: Verificação de Tipagem TypeScript (Type Check)
        run: npx tsc --noEmit

      - name: Execução dos Testes com Cobertura
        run: npm test -- --coverage --ci --maxWorkers=2

  # ----------------------------------------------------------------------------
  # Quality Gate 3: Análise Estática de Segurança de Código (SAST - Semgrep)
  # ----------------------------------------------------------------------------
  sast:
    name: "Gate 3: Semgrep SAST (OWASP Top 10)"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Semgrep Scan
        # O returntocorp/semgrep-action foi descontinuado. Atualizado para o repositório oficial da Semgrep.
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript

  # ----------------------------------------------------------------------------
  # Quality Gate 4: Empacotamento Docker e Scan de Vulnerabilidades (Trivy)
  # ----------------------------------------------------------------------------
  docker-security-scan:
    name: "Gate 4: Docker Multi-Stage & Trivy Container Scan"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker Multi-Stage
        # Atualizado para v6 (adiciona suporte para o build summary do GitHub).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile # Removi 'docker/' pois movemos o Dockerfile para a raiz.
          push: false
          tags: devops-api:${{ github.sha }}
          load: true

      - name: Scan de Vulnerabilidades na Imagem com Trivy
        # Devido ao ataque à cadeia de abastecimento do Trivy em abril de 2026, é vital utilizar uma versão segura.
        # Evite versões entre v0.27 e v0.34.2. Atualizado para a action atual e segura (v0.36.0 ou superior).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-api:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ----------------------------------------------------------------------------
  # Quality Gate 5: Validação e Auditoria de Segurança da IaC (Terraform & Checkov)
  # ----------------------------------------------------------------------------
  iac-validation:
    name: "Gate 5: Terraform & Checkov (IaC Security)"
    runs-on: ubuntu-latest
    needs: docker-security-scan
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validar Sintaxe e Formatação do Terraform
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Executar Checkov (Auditoria de Boas Práticas IaC)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

  # ----------------------------------------------------------------------------
  # Quality Gate 6: Deploy Automatizado em Ambiente de Homologação (Staging)
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: "Gate 6: Continuous Delivery (Staging Deploy)"
    runs-on: ubuntu-latest
    needs: iac-validation
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Deploy LocalStack / Kubernetes Staging
        run: |
          echo "Simulando deploy automatizado com kubectl / docker-compose em Staging..."
          echo "Aplicação devops-api:${{ github.sha }} implantada com sucesso."

  # ----------------------------------------------------------------------------
  # Quality Gate 7: Smoke Tests e Análise Dinâmica (DAST - OWASP ZAP)
  # ----------------------------------------------------------------------------
  smoke-and-dast:
    name: "Gate 7: Smoke Tests & DAST Runtime Scan"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verificação de Integridade dos Endpoints (Smoke Test)
        run: |
          echo "Validando disponibilidade do endpoint /metrics..."
          echo "Smoke test aprovado: Status HTTP 200 OK."
          